<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
  
    <!-- ↓ レスポンシブ対応に必須の記述 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ↓ 検索結果画面で表示される文言 -->
    <meta name="description" content="Discover authentic movie flyers, ticket stubs, and pop culture treasures from Japan. We ship unique collectibles for all kinds of films worldwide!">
    <!-- ↓ 検索ワードをカンマ区切りでcontent内に指定-->
    <meta name="keywords" content="">
    <!-- ↓ 検索にヒットしないようにする(noindex) リンクとの関係性を切る（nofollow）-->
    <meta name="robots" content="noindex, nofollow">
  
    <!-- twitter -->
    <!-- ↓ twitterでリンクに画像を表示 大きい画像: summary-large-image -->
    <meta name="twitter:card" content="summary">
    <!-- ↓ @ユーザ名を入力（任意 -->
    <meta name="twitter:site" content="@username">
    <!-- ↓ そのページの概要を記述する（任意 -->
    <meta name="twitter:description" content="Discover authentic movie flyers, ticket stubs, and pop culture treasures from Japan. We ship unique collectibles for all kinds of films worldwide!">
    <!-- ↓ そのページのタイトルを入力※短くする-->
    <meta name="twitter:title" content="ART-MOVIE-POP JAPAN STORE">
    <!-- ↓ ページのコンテンツを表す任意の画像 -->
    <!-- 画像サイズは144px～4096pxまで。サイズは5MBまで。gif・jpg・png・webpのみ対応(アニメーションは非対応) -->
    <meta name="twitter:image" content="絶対パス">
  
    <!-- twitter以外のサービスとの連携 -->
    <!-- ↓ このページのタイトルを記入 -->
    <!-- <meta property="og:title" content="ART-MOVIE-POP JAPAN STORE"> -->
    <!-- ↓ 通常のサイトはcontent="website" -->
    <!-- <meta property="og:type" content="website"> -->
    <!-- ↓ ページのurlを記入 -->
    <!-- <meta property="og:url" content="絶対パス"> -->
    <!-- ↓ ページの概要説明を記入 -->
    <!-- <meta property="og:description" content=""> -->
    <!-- ↓ サイト名 -->
    <!-- <meta property="og:site_name" content=""> -->
    <!-- ↓ ページリンクを貼り付けた際の画像 -->
    <!-- <meta property="og:image" content="絶対パス"> -->
  
    <!-- ↓ ファビコン設定（タブ内の小さいアイコン） -->
    <link rel="icon" href="images/favicon.ico">
  
    <!-- ↓ iOSホーム画面にリンクを置いた際に表示されるアイコン -->
    <!-- 画像ファイルの名前は「apple-touch-icon.png」 -->
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" sizes="192x192" href="images/apple-touch-icon.png">
  
    <title>ART-MOVIE-POP JAPAN STORE</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  
  <body id="top">
    <div class="wrapper">
      <header class="header">

      </header>
    </div>

    
    
    

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/function.js"></script>
  </body>
</html>
